version: '3.8'
services:
  # ========== Milvus 依赖 + 本体 ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  # ========== Elasticsearch ==========
  es:
    image: elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=YourPassword123!
    volumes:
      - ./volumes/es_data:/usr/share/elasticsearch/data
      - ./volumes/es_plugins:/usr/share/elasticsearch/plugins
    ports:
      - "9200:9200"
      - "9300:9300"

  # ========== BGE-M3 嵌入服务 ==========
  bge-m3:
    build: ./bge-api
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    ports:
      - "8000:8000"
    volumes:
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    # 如需启用 GPU，请先确保 WSL2 中已安装 NVIDIA Container Toolkit，
    # 然后取消下面三行的注释，并注释掉 build 行（需使用 GPU 基础镜像）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ========== PostgreSQL ==========
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: literature
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ========== Literature Agent 后端 ==========
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - MILVUS_HOST=milvus
      - ES_HOST=http://es:9200
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/literature
      - BGE_EMBED_URL=http://bge-m3:8000/embed
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - HF_ENDPOINT=https://hf-mirror.com
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./schemas:/app/schemas
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - postgres
      - milvus
      - es